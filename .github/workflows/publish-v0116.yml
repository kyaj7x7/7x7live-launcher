name: Publish 7x7Live Launcher v0.1.116
on:
  push:
    paths:
      - .github/workflows/publish-v0116.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify launcher assets
        env:
          BASE_URL: https://7x7live.pro/codex-release-upload-20261101
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe" -o 7x7Live-Setup.exe
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe.blockmap" -o 7x7Live-Setup.exe.blockmap
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/latest.yml" -o latest.yml
          echo '757a973653a586723b3587b4f1bcb9d9a0b8dbe9caec5f6966d92604c54b61e0  7x7Live-Setup.exe' | sha256sum --check --status
          echo '1ae94978120100018f07daab39cb6c6ad6318462cb1318905b4853be65f3deff  7x7Live-Setup.exe.blockmap' | sha256sum --check --status
          echo '9c9949e04665580630695303e43dbbba4e597cd4ec34ec98062863b7c8c2d9d7  latest.yml' | sha256sum --check --status
          test "$(stat -c%s 7x7Live-Setup.exe)" -eq 148254761
          grep -Fxq 'version: 0.1.116' latest.yml
          grep -Fxq 'path: 7x7Live-Setup.exe' latest.yml
      - name: Publish launcher update as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -f tag_name=v0.1.116 -f name='7x7Live Launcher v0.1.116' -f body='Fixes stable Timer release resolution and keeps the website installer and in-app updater on the verified GitHub release.' -f make_latest=true
          gh release upload v0.1.116 7x7Live-Setup.exe 7x7Live-Setup.exe.blockmap latest.yml --repo "$GH_REPO"
