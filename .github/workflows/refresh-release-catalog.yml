name: Refresh release catalog
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh latest releases from owned repositories
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const path = 'releases-manifest.json';
            const { data: file } = await github.rest.repos.getContent({ owner, repo: context.repo.repo, path, ref: 'main' });
            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (manifest.version !== 1 || manifest.owner !== owner || !manifest.repositories) throw new Error('Invalid release manifest');
            let changed = false;
            for (const [repository, entry] of Object.entries(manifest.repositories)) {
              try {
                const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo: repository });
                if (!release || release.draft || release.prerelease || !/^v?\d+\\.\d+\\.\d+(?:\\+[a-z\d_.-]+)?$/i.test(release.tag_name)) continue;
                const assets = (release.assets || [])
                  .filter(asset => asset.state === 'uploaded' && Number.isSafeInteger(asset.size) && asset.size > 0 && /^sha256:[a-f\d]{64}$/i.test(asset.digest || ''))
                  .map(asset => ({ name: asset.name, size: asset.size, state: asset.state, digest: asset.digest.toLowerCase(), browser_download_url: asset.browser_download_url }));
                if (!assets.length) continue;
                const next = { tag_name: release.tag_name, draft: false, prerelease: false, assets };
                const serialized = JSON.stringify(next);
                if (entry.latest !== release.tag_name || JSON.stringify(entry.releases?.[release.tag_name]) !== serialized) changed = true;
                entry.releases ||= {};
                entry.releases[release.tag_name] = next;
                entry.latest = release.tag_name;
              } catch (error) {
                core.info(`Skipping ${repository}: ${error.status || error.message}`);
              }
            }
            if (!changed) {
              core.info('Release manifest is already current.');
              return;
            }
            manifest.updated_at = new Date().toISOString();
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              sha: file.sha,
              message: 'Automatically refresh app release versions',
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64')
            });
            core.info('Updated release manifest.');
