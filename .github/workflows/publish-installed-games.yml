name: Publish verified locally installed games
on:
  push:
    paths:
      - .github/workflows/publish-installed-games.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify both game packages
        env:
          CORE_URL: https://7x7live.pro/game-release-cache-2a96e28c/core-bastion.zip
          CORE_SHA256: ec0a93eba63181ee92d33e179a1c4ac2e0702565be27193684578586d6bc26f7
          BALANCE_URL: https://7x7live.pro/game-release-cache-2a96e28c/sky-balance.zip
          BALANCE_SHA256: 47290ab39f2123495bb9fb8b7dc4ba599974effae330544a6835dac79e4c7407
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$CORE_URL" -o core-bastion-win-unpacked.zip
          curl --fail --location --silent --show-error --retry 3 "$BALANCE_URL" -o sky-balance-win-unpacked.zip
          echo "$CORE_SHA256  core-bastion-win-unpacked.zip" | sha256sum --check --status
          echo "$BALANCE_SHA256  sky-balance-win-unpacked.zip" | sha256sum --check --status
          unzip -tq core-bastion-win-unpacked.zip
          unzip -tq sky-balance-win-unpacked.zip
          unzip -Z1 core-bastion-win-unpacked.zip | grep -Fxq './Core Bastion.exe'
          unzip -Z1 core-bastion-win-unpacked.zip | grep -Fxq './resources/app.asar'
          unzip -Z1 sky-balance-win-unpacked.zip | grep -Fxq './Sky Balance.exe'
          unzip -Z1 sky-balance-win-unpacked.zip | grep -Fxq './resources/app.asar'
      - name: Create non-latest app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -F tag_name=v1.1.0 -F name='7x7Live games v1.1.0' -F body='Verified Windows builds of Core Bastion and Sky Balance. The launcher verifies each ZIP SHA-256 before installation.' -f make_latest=false
          gh release upload v1.1.0 core-bastion-win-unpacked.zip sky-balance-win-unpacked.zip --repo "$GH_REPO"
