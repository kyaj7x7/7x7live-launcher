name: Publish 7x7Live Launcher update
on:
  push:
    paths:
      - .github/workflows/publish-v0115.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify launcher assets
        env:
          BASE_URL: https://7x7live.pro/codex-release-upload-20261101
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe" -o 7x7Live-Setup.exe
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe.blockmap" -o 7x7Live-Setup.exe.blockmap
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/latest.yml" -o latest.yml
          echo '93ce3653417708fead94dc98b4002d5172a9bc008fcd86523e195c184238f233  7x7Live-Setup.exe' | sha256sum --check --status
          echo 'ddb7fbb30dd9b87a70a112c55ef3ee535030177de89650e978c8476487b255bf  7x7Live-Setup.exe.blockmap' | sha256sum --check --status
          echo '0eb6fe531de1c7475a06181812f77b90a5c9466185fefd5c4b2512b9509630d0  latest.yml' | sha256sum --check --status
          test "$(stat -c%s 7x7Live-Setup.exe)" -eq 148253801
          grep -Fxq 'version: 0.1.115' latest.yml
          grep -Fxq 'path: 7x7Live-Setup.exe' latest.yml
      - name: Publish launcher update as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -f tag_name=v0.1.115 -f name='7x7Live Launcher v0.1.115' -f body='Routes owned 7x7Live games and apps to verified GitHub releases; adds a SHA-256 checked raw release manifest fallback for GitHub API rate limits.' -f make_latest=true
          gh release upload v0.1.115 7x7Live-Setup.exe 7x7Live-Setup.exe.blockmap latest.yml --repo "$GH_REPO"
