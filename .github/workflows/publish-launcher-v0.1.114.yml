name: Publish 7x7Live Launcher update
on:
  push:
    paths:
      - .github/workflows/publish-launcher-v0.1.114.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify installer assets
        env:
          BASE_URL: https://7x7live.pro/launcher-release-cache-1178a0f4
          SETUP_SHA512_BASE64: wfn0HqxfSTDnQ4SBD559Nwd/8yuhMC5aovKaO25B7CvackWOyNln4OjqT9owjI5brUR4Yf6gxv1s2mVoe6kLfg==
          BLOCKMAP_SHA256: 0F07DCB6A26CB8B5089B1995C848D03DF570D543D804F93111A476515F9AA59A
          LATEST_SHA256: 827EFE14218D6877C5CA250C21DE1F7E738C672B15B45A6B1007D9CD254B3BD4
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe" -o 7x7Live-Setup.exe
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe.blockmap" -o 7x7Live-Setup.exe.blockmap
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/latest.yml" -o latest.yml
          actual=$(openssl dgst -sha512 -binary 7x7Live-Setup.exe | base64 -w0)
          test "$actual" = "$SETUP_SHA512_BASE64"
          echo "$BLOCKMAP_SHA256  7x7Live-Setup.exe.blockmap" | sha256sum --check --status
          echo "$LATEST_SHA256  latest.yml" | sha256sum --check --status
          grep -Fxq 'version: 0.1.114' latest.yml
          grep -Fxq 'path: 7x7Live-Setup.exe' latest.yml
      - name: Publish launcher update as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -F tag_name=v0.1.114 -F name='7x7Live Launcher v0.1.114' -F body='7x7Live Launcher update. Includes owner GitHub release downloads for games and SHA-256 verified package installation.' -F make_latest=true
          gh release upload v0.1.114 7x7Live-Setup.exe 7x7Live-Setup.exe.blockmap latest.yml --repo "$GH_REPO"
