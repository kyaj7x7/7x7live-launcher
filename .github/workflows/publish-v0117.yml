name: Publish 7x7Live Launcher v0.1.117
on:
  push:
    paths:
      - .github/workflows/publish-v0117.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify launcher assets
        env:
          BASE_URL: https://7x7live.pro/codex-release-upload-20261101
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe" -o 7x7Live-Setup.exe
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/7x7Live-Setup.exe.blockmap" -o 7x7Live-Setup.exe.blockmap
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/latest.yml" -o latest.yml
          echo '77b520f1810cb6a7b3bd0dead0b1f677d1300bdab275ef5b63626cdd66ed46ca  7x7Live-Setup.exe' | sha256sum --check --status
          echo 'd61a6b68fc0a72139606ef1aa65d4996e609abdc768ce369f8f27d69d311ef92  7x7Live-Setup.exe.blockmap' | sha256sum --check --status
          echo '9ac046ea61c03f755c24b43ef9d03c53fd0154c9b11d1e5ce70cdb47429257e0  latest.yml' | sha256sum --check --status
          test "$(stat -c%s 7x7Live-Setup.exe)" -eq 148255824
          grep -Fxq 'version: 0.1.117' latest.yml
          grep -Fxq 'path: 7x7Live-Setup.exe' latest.yml
      - name: Publish launcher update as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -f tag_name=v0.1.117 -f name='7x7Live Launcher v0.1.117' -f body='Makes in-place self updates target the running custom installation directory and adds updater diagnostics.' -f make_latest=true
          gh release upload v0.1.117 7x7Live-Setup.exe 7x7Live-Setup.exe.blockmap latest.yml --repo "$GH_REPO"
